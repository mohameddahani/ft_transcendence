# -----------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# All plain HTTP traffic on port 80 is immediately redirected to HTTPS.
# -----------------------------------------------------------------------------

server {
	listen 80;
	listen [::]:80;
	server_name 127.0.0.1;

	location /nginx_status {
		stub_status;
		allow 172.16.0.0/12;
		deny all;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}