services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backend:latest
    container_name: backend_container
    restart: unless-stopped
    env_file:
      - ../backend/.env
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../admin-staff-platform
      dockerfile: Dockerfile
    image: frontend:latest
    container_name: frontend_container
    restart: unless-stopped
    env_file:
      - ../admin-staff-platform/.env
    networks:
      - ft_transcendence-net
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy

  superadmin:
    build:
      context: ../owner-platform
      dockerfile: Dockerfile
    image: superadmin:latest
    container_name: superadmin_container
    restart: unless-stopped
    env_file:
      - ../owner-platform/.env
    networks:
      - ft_transcendence-net
    depends_on:
      backend:
        condition: service_healthy

  ai:
    build:
      context: ../AI
      dockerfile: Dockerfile
    image: ai:latest
    container_name: ai_container
    restart: unless-stopped
    env_file:
      - ../AI/.env
    networks:
      - ft_transcendence-net
    volumes:
      - ai_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    env_file:
      - .env
    command: >
        redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redisdata:/data
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
    networks:
      - ft_transcendence-net
    depends_on:
      - frontend
      - superadmin

volumes:
  postgres_data:
  ai_data:
  redisdata:

networks:
  ft_transcendence-net:
    driver: bridge
