services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: backend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
    - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
