services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backend:latest
    container_name: backend_container
    restart: unless-stopped
    env_file:
      - ../backend/.env
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../admin-staff-platform
      dockerfile: Dockerfile
    image: frontend:latest
    container_name: frontend_container
    restart: unless-stopped
    env_file:
      - ../admin-staff-platform/.env
    networks:
      - ft_transcendence-net
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy

  superadmin:
    build:
      context: ../owner-platform
      dockerfile: Dockerfile
    image: superadmin:latest
    container_name: superadmin_container
    restart: unless-stopped
    env_file:
      - ../owner-platform/.env
    networks:
      - ft_transcendence-net
    depends_on:
      backend:
        condition: service_healthy

  ai:
    build:
      context: ../AI
      dockerfile: Dockerfile
    image: ai:latest
    container_name: ai_container
    restart: unless-stopped
    env_file:
      - ../AI/.env
    networks:
      - ft_transcendence-net
    volumes:
      - ai_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    env_file:
      - .env
    command: >
        redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redisdata:/data
    networks:
      - ft_transcendence-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
    networks:
      - ft_transcendence-net
    depends_on:
      - frontend
      - superadmin

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - ft_transcendence-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ft_transcendence-net
    depends_on:
      - prometheus
  
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    networks:
      - ft_transcendence-net

volumes:
  postgres_data:
  ai_data:
  redisdata:
  prometheus_data:
  grafana_data:

networks:
  ft_transcendence-net:
    driver: bridge
