apiVersion: 1

providers:
  - name: GymFlow
    type: file
    disableDeletion: false      # allow deleting from UI
    updateIntervalSeconds: 30   # reload JSON files every 30s (hot reload)
    allowUiUpdates: true        # allow editing in UI, saves back to JSON
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true