# ------------------------------------------------------------------------#
#                            Redis configuration                          #
# ------------------------------------------------------------------------#

# -- Network --------------------------------------------------------------
# Only accept connections from within the Docker internal network.
bind 0.0.0.0
port 6379
protected-mode yes

# -- Memory ---------------------------------------------------------------
# Hard cap on memory usage. When hit, Redis evicts keys using the policy below.
maxmemory 256mb

# allkeys-lru: when memory is full, evict the least-recently-used key across
maxmemory-policy allkeys-lru

# -- Persistence ----------------------------------------------------------
# snapshot if at least 1 key changed at 900s
save 900 1 
save 300 10 
save 60 10000

# snapshot storage location
dir /data
dbfilename dump.rdb

# Disable AOF (append-only file) - overkill for a cache, adds I/O overhead
appendonly no

# -- Performance ----------------------------------------------------------
# How many databases (we only use db 0)
databases 1

# Max simultaneous clients
maxclients 100

