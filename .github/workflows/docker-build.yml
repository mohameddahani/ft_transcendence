name: Docker Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false       # all services build even if one fails
      matrix:
        service:
          - name: frontend
            context: frontend
          - name: owner-platform
            context: owner-platform
          - name: backend
            context: backend
          - name: blockchain-api
            context: block-chain/api
          - name: ai
            context: AI
          - name: nginx
            context: devops/nginx

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false          # build only, no registry yet
          cache-from: type=gha
          cache-to: type=gha,mode=max